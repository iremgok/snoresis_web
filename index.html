<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A192F" />
    <meta
      name="description"
      content="Snoresis AI — horlama ve uyku apnesini yapay zeka destekli akıllı yüzükle takip edin. SpO2, nabız ve apne analizi, doktor raporu."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* React yüklenene kadar gösterilen marka yükleyicisi (SnoresisLoading ile aynı görünüm) */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #fbfaf7; }
      .boot-badge { position: relative; display: grid; place-items: center; }
      .boot-badge::before { content: ""; position: absolute; width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, #7b3ff2, #4f46e5); opacity: 0.4; filter: blur(24px); animation: boot-breathe 6s ease-in-out infinite; }
      .boot-badge svg { position: relative; border-radius: 50%; animation: boot-glow 1.8s ease-in-out infinite; }
      .boot p { margin: 0; font: 600 14px/1.4 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.025em; color: #62748e; }
      @keyframes boot-glow {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgb(123 63 242 / 0.35), 0 12px 32px -10px rgb(79 70 229 / 0.55); }
        50% { transform: scale(1.06); box-shadow: 0 0 0 14px rgb(123 63 242 / 0), 0 16px 44px -8px rgb(79 70 229 / 0.75); }
      }
      @keyframes boot-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { .boot-badge::before, .boot-badge svg { animation: none; } }
    </style>
    <title>Snoresis AI — Uykunuzun Kontrolü Artık Sizde</title>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <span class="boot-badge">
          <svg width="64" height="64" viewBox="0 0 48 48" aria-hidden="true">
            <defs>
              <linearGradient id="boot-g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7B3FF2" />
                <stop offset="1" stop-color="#4f46e5" />
              </linearGradient>
            </defs>
            <circle cx="24" cy="24" r="24" fill="url(#boot-g)" />
            <circle cx="24" cy="24" r="23" fill="none" stroke="#fff" stroke-opacity="0.18" />
            <path d="M31 16.5c-1.8-2.6-4.6-3.9-7.6-3.7-3.7.3-6 2.8-5.6 5.6.5 3.1 3.8 4.1 6.7 4.9 3.4.9 7 2 7.3 5.6.3 3.3-2.5 5.9-6.5 6.2-3.4.2-6.4-1.2-8.1-3.8" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" />
          </svg>
        </span>
        <p>Snoresis Yükleniyor...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
